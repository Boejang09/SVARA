name: svara_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  record: ^7.1.1
  http: ^1.4.0
  path_provider: ^2.1.0
  audioplayers: ^6.8.1
