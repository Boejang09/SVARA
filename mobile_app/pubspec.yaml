  intl: ^0.20.3

  video_player: ^2.10.0

  lottie: ^3.3.1

  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
